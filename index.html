<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f6f8" />
    <meta
      name="description"
      content="Physical AI simulation cases by WEI: robotics, reinforcement learning, DEM and SPH. Available in English and Japanese."
    />
    <title>Physical AI Showcase · WEI</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="cases.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content" data-i18n="skip"
      >Skip to content</a
    >
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="#cases">
          <span class="brand-mark" aria-hidden="true">W<span></span></span>
          <span class="brand-name"
            >WEI <span class="brand-divider">/</span> Physical AI</span
          >
        </a>
        <div class="language-switch" role="group" aria-label="Language / 言語">
          <button
            type="button"
            data-language="en"
            lang="en"
            aria-pressed="true"
          >
            EN
          </button>
          <button
            type="button"
            data-language="ja"
            lang="ja"
            aria-pressed="false"
          >
            日本語
          </button>
        </div>
      </div>
    </header>

    <div class="shell">
      <section class="intro" aria-labelledby="page-title">
        <div class="intro-copy">
          <p class="eyebrow">
            <span class="status-dot"></span> ENGINEERING & RESEARCH
          </p>
          <h1 id="page-title" data-i18n="siteTitle">Physical AI Showcase</h1>
          <p class="intro-description" data-i18n="intro">
            A collection of simulation studies and engineering workflows for
            Physical AI.
          </p>
        </div>
        <div class="intro-stats" aria-label="Collection / コレクション">
          <div>
            <strong id="case-count">7</strong
            ><span data-i18n="caseStat">simulation cases</span>
          </div>
          <div>
            <strong id="demo-count">25</strong
            ><span data-i18n="demoStat">video demonstrations</span>
          </div>
        </div>
      </section>

      <nav
        class="section-nav"
        aria-label="Collection sections / コンテンツ分類"
      >
        <a href="#cases" data-section="cases" aria-current="page">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            aria-hidden="true"
          >
            <rect x="3" y="4" width="18" height="16" rx="3" />
            <path d="m10 9 5 3-5 3Z" />
          </svg>
          <span data-i18n="cases">Simulation Cases</span
          ><span class="nav-count" id="nav-case-count">07</span>
        </a>
        <a href="#solvers" data-section="solvers">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            aria-hidden="true"
          >
            <path d="m12 3 9 5-9 5-9-5 9-5Z" />
            <path d="m3 12 9 5 9-5M3 16l9 5 9-5" />
          </svg>
          <span data-i18n="solvers">Solvers</span>
        </a>
        <a href="#papers" data-section="papers">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            aria-hidden="true"
          >
            <path
              d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9l-6-6Z"
            />
            <path d="M14 3v6h6M8 13h8M8 17h5" />
          </svg>
          <span data-i18n="papers">Papers</span>
        </a>
      </nav>

      <main id="main-content" tabindex="-1"></main>
      <noscript
        ><p class="noscript">
          Please enable JavaScript to browse the cases and switch languages.<br />事例の閲覧と言語切替には、JavaScriptを有効にしてください。
        </p></noscript
      >

      <footer class="site-footer">
        <span>WEI <span class="footer-divider">/</span> 崔 煒</span>
        <span data-i18n="footer">Physical AI · Simulation & Engineering</span>
      </footer>
    </div>
  </body>
</html>
